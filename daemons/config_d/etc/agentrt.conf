#
# AirymaxOS 统一配置（A-UCS）
#
# 本文件是全局共享参数的唯一权威来源。所有守护进程启动时读取，
# config_d 负责校验、发布快照并把可变项下发到内核 sysctl。
# 本文件缺失时 config_d 拒绝启动，内核与用户态保留内置默认值。
#
# 覆盖顺序：本文件 → <daemon>.conf → conf.d/NN-*.conf
# conf.d 内只加载以两位数字加连字符开头的 *.conf，按文件名字典序叠加。

[main]
# 配置版本闸门。与运行时不一致时整份配置被拒绝，不做事后修补。
version = 1

[log]
# 最低日志级别：0=emerg 1=info 2=warn 3=err 4=crit 5=notice 6=debug 7=trace
min_level = 1
# 日志环条目容量（条），按 2 的幂向上取整
ring_capacity = 4096

[ipc]
# IPC 环深度（条）
ring_size = 1024
# 快速路径单次批处理预算（纳秒）
fastpath_budget_ns = 10

[sched]
# 实时任务在 1s 周期内可占用的运行时间（微秒），0 表示不限制
rt_runtime_us = 950000
# deadline 任务的默认周期（微秒）
deadline_period_us = 50000

[superv]
# 心跳间隔（秒）
heartbeat_interval = 1
# 心跳超时（秒），超过即判定失联
heartbeat_timeout = 30

[cap]
# 单节点最大 Agent 数；启动后不可热改
max_agents = 1024
# 能力 epoch 位宽：8 / 16 / 32
epoch_bits = 16
# 能力随机标签位宽：16 / 32
randtag_bits = 32
# 伪造检测阈值（次/秒）
forge_threshold = 100
