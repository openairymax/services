# AirymaxOS 日志守护配置（A-UCS 严格 INI）
# 只接受 [logger] 分组；未知键与非法取值会让守护启动失败而不是默默用默认值。
# 装载后本文件必须与内置默认值逐键一致（ci/gates/logger-d.sh 会校验）。

[logger]

# 内核日志环字符设备
device = /dev/airy_log

# 落盘路径，父目录不存在时按 0750 逐级创建
path = /var/log/agentrt/airy.log

# 最低落盘级别：debug / info / warn / error / fatal
level = info

# 周期性 fdatasync 间隔（毫秒，0 表示只在轮转与退出时同步）
flush_ms = 200

# 单文件大小上限（支持 K/M/G 后缀），达到后轮转
max_bytes = 100M

# 单文件存活上限（秒），与 max_bytes 至少启用一项
max_age_s = 86400

# 轮转历史文件的最大序号，连同当前文件共保留 keep 个文件
keep = 16
