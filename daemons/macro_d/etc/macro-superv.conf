# AirymaxOS 监督守护配置（A-UCS 严格 INI）
# 只接受 [superv] 与 [policy] 分组；未知分组、未知键与非法动作名会让
# 守护启动失败，而不是默默退回默认值。

[superv]

# 故障通道字符设备；单消费者，同一时刻只允许一个监督进程打开
device = /dev/airy_superv

[policy]

# 故障码 → 裁决动作，可选 warn / degrade / pause / terminate
cap_forged = terminate
cap_leak = terminate
ring_corrupt = pause
timeout = degrade
abnormal_cap = warn
vm_fault = warn
